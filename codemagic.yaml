workflows:
  flutter-ios-workflow:
    name: Flutter iOS Shooter Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Clean Old iOS Directory
        script: |
          # 強制刪除原本壞掉的 ios 資料夾
          rm -rf ios
      - name: Recreate Clean Flutter iOS Project
        script: |
          # 重新乾淨生成全新的 iOS 專案結構
          flutter create --platforms=ios .
      - name: Get Flutter Packages
        script: flutter pub get
      - name: Build iOS App
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
