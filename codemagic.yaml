workflows:
  web-game-workflow:
    name: Web Game Build Check
    max_build_duration: 10
    instance_type: mac_mini_m2
    scripts:
      - name: Validate Index File
        script: |
          echo "Checking if index.html exists..."
          if [ -f "index.html" ]; then
            echo "SUCCESS: index.html found!"
          else
            echo "ERROR: index.html missing!"
            exit 1
          fi
      - name: Package App Artifact
        script: |
          mkdir -p build
          zip -r build/game-app.zip index.html
    artifacts:
      - build/*.zip
